<body><div><h2 style="font-weight:600">Бета стала основной версией ✨</h2><p>Открываю приложение… Если не открылось — <a href="../">нажмите сюда</a>.<br>Значок «Diary β» на экране «Домой» можно удалить — данные останутся.</p></div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/beta/'))r.unregister()}));}
if(window.caches){caches.keys().then(ks=>ks.filter(k=>k.startsWith('kdbeta-')).forEach(k=>caches.delete(k)));}
setTimeout(()=>{location.replace('../')},1500);</script></body></html>
